server {
    listen 80;
    server_name _; # À remplacer par l'IP du VPS ou votre nom de domaine

    # Racine du projet (Frontend React build)
    root /var/www/nordinestore/client/dist;
    index index.html;

    # Gérer le routage React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Servir les uploads médias directement via Nginx pour de meilleures performances
    location /uploads/ {
        alias /var/www/nordinestore/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy inverse pour les requêtes API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Augmenter les limites de taille de corps pour l'importation de fichiers Excel volumineux
        client_max_body_size 50M;
    }

    # Proxy inverse avec WebSocket support pour Socket.io (Notifications en temps réel)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver la mise en mémoire tampon pour les connexions persistantes
        proxy_buffering off;
    }
}
